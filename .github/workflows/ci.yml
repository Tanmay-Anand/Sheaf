name: CI

on:
  push:
    branches: ["main", "M-*/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Service: lint → test → package (which regenerates the JSON Schema)
  # ─────────────────────────────────────────────────────────────────────────────
  service:
    name: Service (Java 21)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build, test, and generate schema
        run: mvn --batch-mode verify
        working-directory: service

      # Make the generated schema available to the addin job
      - uses: actions/upload-artifact@v4
        with:
          name: contract-schema
          path: contract/schema/

  # ─────────────────────────────────────────────────────────────────────────────
  # Add-in: typecheck → lint → generate types → contract drift check → build
  # ─────────────────────────────────────────────────────────────────────────────
  addin:
    name: Add-in (Node 22)
    runs-on: ubuntu-latest
    needs: service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: addin/package-lock.json

      # Restore schema generated by the service job
      - uses: actions/download-artifact@v4
        with:
          name: contract-schema
          path: contract/schema/

      - name: Install dependencies
        run: npm ci
        working-directory: addin

      - name: Generate TypeScript types from schema
        run: npm run generate-types
        working-directory: addin

      - name: Type-check
        run: npm run typecheck
        working-directory: addin

      - name: Lint
        run: npm run lint
        working-directory: addin

      - name: Unit and golden tests
        run: npm test
        working-directory: addin

      - name: Validate manifest
        run: npm run validate-manifest
        working-directory: addin

      - name: Production build
        run: npm run build
        working-directory: addin

  # ─────────────────────────────────────────────────────────────────────────────
  # Contract drift: regenerate everything on a clean checkout and diff
  # A divergence means a Java record changed without regenerating the TS types.
  # ─────────────────────────────────────────────────────────────────────────────
  contract-drift:
    name: Contract drift check
    runs-on: ubuntu-latest
    needs: [service, addin]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: addin/package-lock.json

      - name: Regenerate schema
        run: mvn --batch-mode prepare-package -pl .
        working-directory: service

      - name: Install addin dependencies
        run: npm ci
        working-directory: addin

      - name: Regenerate TypeScript types
        run: npm run generate-types
        working-directory: addin

      - name: Fail if contract differs from committed snapshot
        # Test the exit code in the `if` itself: under the runner's `bash -e`, a bare failing
        # `git diff` would end the step before the explanation below could print.
        run: |
          if ! git diff --exit-code contract/; then
            echo "::error::Contract drift detected. Run 'mvn prepare-package' in service/ and 'npm run generate-types' in addin/, then commit the updated contract/ files."
            exit 1
          fi
