# HTTPS for local development, reusing the certificate `office-addin-dev-certs` already
# installed for the add-in (the same one webpack-dev-server serves on https://localhost:3000).
#
# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=https
# The pane calls https://localhost:8443 by default (override with SHEAF_SERVICE_URL at build time).
#
# HTTPS is required before API keys can be entered in the pane (M5): keys must never travel over
# plain HTTP, even on localhost.
server:
  port: 8443
  ssl:
    bundle: office-dev

spring:
  ssl:
    bundle:
      pem:
        office-dev:
          keystore:
            certificate: "file:${SHEAF_DEV_CERT_DIR:${user.home}/.office-addin-dev-certs}/localhost.crt"
            private-key: "file:${SHEAF_DEV_CERT_DIR:${user.home}/.office-addin-dev-certs}/localhost.key"
